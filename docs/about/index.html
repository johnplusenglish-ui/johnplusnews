<style>:root {

  --line: #e6e8ec;

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

.wrap { width: 100%; max-width: var(--measure); margin: 0 auto; padding: 0 20px; }

.skip { position: absolute; left: -999px; top: 8px; background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 6px; z-index: 10; }

.card { position: relative; min-width: 0; }

.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.thumb .blank { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; font-size: 1.75rem; font-weight: 700; color: var(--accent); }
.card h2 { font-size: 1.3125rem; line-height: 1.25; margin: 4px 0 6px; }
.card h2 a { color: var(--ink); text-decoration: none; }
.card h2 a::after { content: ''; position: absolute; inset: 0; }
.card:hover h2 a, .card h2 a:focus-visible { color: var(--accent); }
.card h2 a:focus-visible { outline: none; }

.prose ul { margin: 0 0 1.25em; padding-left: 1.3em; }
.prose li { margin-bottom: 0.4em; }
.prose blockquote { margin: 1.6em 0; padding: 18px 22px; background: var(--accent-soft); border-radius: 10px; color: var(--ink); }
.prose blockquote p:last-child { margin-bottom: 0; }
.prose figure { margin: 1.8em 0; }
.prose figure img { display: block; width: 100%; height: auto; border-radius: 10px; }
.source { font-size: 0.9375rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 18px; margin: 12px 0 0; }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; border-top: 1px solid var(--line); margin: 36px 0 64px; padding-top: 24px; }
.pager > * { min-width: 0; }
.pager a { display: block; text-decoration: none; color: var(--ink); font-weight: 600; line-height: 1.35; }
.pager a:hover { color: var(--accent); }
.pager small { display: block; font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.pager .next { text-align: right; grid-column: 2; }

.empty { padding: 24px 0 96px; color: var(--muted); font-size: 1.125rem; }

/* wide (gallery) pages */
